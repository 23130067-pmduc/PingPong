<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PingPong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <h1>PINGPONG GAME</h1>
        <div class="hud">
            <span>Màn: <strong id="level">1</strong></span>
            <span>Điểm: <strong id="score">0</strong></span>
            <span>Mạng: <strong id="lives">3</strong></span>
        </div>
        <canvas id="gameCanvas" width="900" height="600">
            Trình duyệt của bạn không hỗ trợ Canvas.
        </canvas>
        <p>Di chuyển bằng chuột hoặc bằng phím ←, →, phím space để thả bóng</p>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
