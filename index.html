<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PingPong Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
    <section id="menuScreen" class="screen menu">
        <h1>PINGPONG GAME</h1>

        <div class="menu-buttons">
            <button id="playButton">Chơi</button>
            <button id="levelButton">Chọn màn</button>
            <button id="guideButton">Hướng dẫn</button>
        </div>
    </section>


    <section id="gameScreen" class="screen game hidden">

        <h1>PINGPONG GAME</h1>

        <div class="hud">
                <span>
                    Màn:
                    <strong id="level">1</strong>
                </span>

            <span>
                    Điểm:
                    <strong id="score">0</strong>
                </span>
        </div>

        <canvas id="gameCanvas" width="900" height="600">
            Trình duyệt của bạn không hỗ trợ Canvas.
        </canvas>

        <p>
            Di chuyển bằng chuột hoặc phím ←, →.
            Nhấn Space để thả bóng.
        </p>

    </section>

    <section id="resultScreen" class="screen result hidden">
        <h1 id="resultTitle">THẮNG</h1>

        <p id="resultText"></p>

        <div class="result-buttons">
            <button id="restartButton">Chơi lại</button>
            <button id="nextButton">Tiếp theo</button>
            <button id="homeButton">Màn hình chính</button>
        </div>
    </section>
</main>

<script src="js/main.js"></script>

</body>

</html>
